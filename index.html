<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plan7 | Organizador de Tarefas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--navy:#0A1626;--ink:#0F1F33;--card:#0F2138;--line:#E2E8F0;--blue:#1D6FD8;--blue2:#4DA3FF;--mut:#5B6B80;--band:#F1F5F9}
*{box-sizing:border-box}
body{margin:0;font-family:"Jost",system-ui,-apple-system,"Segoe UI",sans-serif;font-weight:400;background:var(--band);color:var(--ink)}
b,strong{font-weight:500}
header{background:var(--navy);padding:22px 16px 26px}
.hin{max-width:760px;margin:0 auto}
.brand{display:flex;align-items:center;gap:14px}
.brand svg{width:56px;height:56px;flex:none}
.bn{font-weight:500;font-size:1.6rem;letter-spacing:.04em;color:#fff;line-height:1}
.bn i{font-style:normal;color:var(--blue2)}
.bs{font-weight:500;font-size:.68rem;letter-spacing:.22em;color:#9FB0C4;margin-top:6px}
.bl{font-size:.6rem;letter-spacing:.2em;color:var(--blue2);margin-top:4px;font-weight:500}
.hoje{color:#9FB0C4;font-size:.9rem;margin-top:18px}
.wrap{max-width:760px;margin:0 auto;padding:18px 16px 110px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:#E2E8F0;border-radius:14px;padding:4px;margin-bottom:14px}
.seg button{border:0;background:none;padding:11px;border-radius:11px;font:inherit;font-weight:500;color:var(--mut);cursor:pointer;letter-spacing:.02em}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(10,22,38,.12)}
.mnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.mnav b{font-weight:500;font-size:1.15rem;text-transform:capitalize}
.mnav button{border:1px solid var(--line);background:#fff;border-radius:99px;width:38px;height:38px;font:inherit;font-size:1.1rem;cursor:pointer;color:var(--ink)}
.mnav button:disabled{opacity:.35;cursor:default}
.stats2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.stat small{display:block;font-size:.72rem;color:#9FB0C4;margin-top:3px}
.stat.neg b{color:#FF8A80}
.fsec{background:#fff;border:1px solid var(--line);border-radius:20px;padding:6px 14px 10px;margin-bottom:14px}
.fsec h3{margin:12px 0 4px;font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;color:var(--blue);font-weight:500;display:flex;justify-content:space-between}
.fsec h3 span{color:var(--ink);letter-spacing:.02em;text-transform:none;font-size:.85rem}
.frow{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.frow:first-of-type{border-top:0}
.frow.done .ft{color:var(--mut)}
.frow.late{background:#FEF2F2;margin:0 -14px;padding:10px 14px;border-radius:12px}
.frow.late .fm{color:#D93025}
.fb{flex:1;min-width:0}
.ft{font-weight:500}
.fm{font-size:.78rem;color:var(--mut);margin-top:2px}
.fv{text-align:right;font-weight:500;white-space:nowrap}
.fv small{display:block;font-weight:400;font-size:.7rem;color:#1A9C5B}
.fnote{font-size:.78rem;color:var(--mut);margin:8px 0 0}
.dbtn{flex:1;padding:11px;border-radius:12px;border:1px solid #F3B4B4;background:#FEF2F2;color:#B3261E;font:inherit;font-weight:500;cursor:pointer;font-size:.85rem}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid #2A3B52;border-radius:20px;padding:14px}
.stat b{display:block;font-size:1.2rem;color:#fff}
.stat span{font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:var(--blue2);font-weight:500}
.tabs{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:#fff;padding:7px 16px;border-radius:99px;cursor:pointer;font:inherit;font-size:.88rem;color:var(--ink)}
.tab.on{background:var(--ink);border-color:var(--ink);color:#fff}
.day{margin:22px 0 8px;font-size:.7rem;text-transform:uppercase;letter-spacing:.2em;color:var(--blue);font-weight:500;display:flex;gap:8px;align-items:center}
.day em.atr{background:#D93025}
.day em{font-style:normal;background:var(--navy);color:#fff;border-radius:99px;padding:2px 10px;font-size:.62rem;letter-spacing:.12em}
.task{background:#fff;border:1px solid var(--line);border-left:4px solid var(--blue);border-radius:20px;padding:14px;margin-bottom:8px;display:flex;gap:12px;align-items:flex-start}
.task.receber{border-left-color:var(--navy)}
.task.late{background:#FEF2F2;border-color:#F3B4B4;border-left-color:#D93025}
.task.late .tp{color:#D93025}
.task.late .val{color:#B3261E}
.warn{display:flex;gap:9px;align-items:flex-start;margin-top:9px;padding:9px 11px;border-radius:12px;background:#FFF4D6;border:1px solid #F0C24B;color:#6B4A00;font-size:.85rem;line-height:1.35}
.warn svg{flex:none;margin-top:1px}
.chips{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.chip{font:inherit;font-size:.74rem;font-weight:500;padding:4px 11px;border-radius:99px;border:1px solid var(--line);background:#fff;color:var(--mut);cursor:pointer}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chip.pay.on{background:#1A9C5B;border-color:#1A9C5B}
.task.done{opacity:.5}
.task.done .t{text-decoration:line-through}
.chk{width:22px;height:22px;margin-top:2px;accent-color:var(--blue);flex:none;cursor:pointer}
.body{flex:1;min-width:0}
.t{font-weight:500}
.tp{font-size:.62rem;letter-spacing:.16em;text-transform:uppercase;color:var(--blue);font-weight:500;margin-bottom:3px}
.meta{font-size:.85rem;color:var(--mut);margin-top:3px;display:flex;flex-wrap:wrap;gap:4px 14px}
.val{color:var(--ink);font-weight:500}
.act{display:flex;gap:2px}
.ib{background:none;border:0;cursor:pointer;font:inherit;font-size:.78rem;padding:5px 8px;border-radius:8px;color:var(--mut)}
.ib:hover{background:var(--band);color:var(--ink)}
.empty{text-align:center;color:var(--mut);padding:40px 0}
.fab{position:fixed;left:16px;bottom:20px;background:var(--blue);color:#fff;border:0;border-radius:99px;padding:14px 22px;font:inherit;font-size:1rem;font-weight:500;box-shadow:0 4px 14px rgba(29,111,216,.35);cursor:pointer}
.ov{position:fixed;inset:0;background:rgba(10,22,38,.6);display:none;align-items:flex-end;justify-content:center;z-index:5}
.ov.on{display:flex}
.modal{background:#fff;width:100%;max-width:520px;border-radius:24px 24px 0 0;padding:22px;max-height:92vh;overflow:auto}
@media(min-width:600px){.ov{align-items:center}.modal{border-radius:24px}}
.modal h2{margin:0 0 12px;font-size:1.2rem;font-weight:500}
label{display:block;font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;color:var(--blue);font-weight:500;margin:12px 0 4px}
input,select,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:12px;font:inherit;background:#fff;color:var(--ink)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btns{display:flex;gap:10px;margin-top:18px}
.btn{flex:1;padding:12px;border-radius:12px;border:1px solid var(--line);background:#fff;font:inherit;font-weight:500;cursor:pointer;color:var(--ink)}
.btn.p{background:var(--navy);color:#fff;border-color:var(--navy)}
.contact{position:fixed;left:0;right:0;bottom:0;background:var(--navy);padding:10px 12px;z-index:4}
.cin{max-width:760px;margin:0 auto;background:#fff;border-radius:20px;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.cw{font-weight:500;font-size:.95rem}
.cw small{display:block;font-weight:400;font-size:.72rem;color:var(--mut)}
.loc{display:inline-flex;align-items:center;gap:6px;background:#E8F1FD;color:var(--blue);border-radius:99px;padding:6px 12px;font-size:.78rem;font-weight:500}
</style>
</head>
<body>
<header>
  <div class="hin">
    <div class="brand">
      <svg viewBox="0 0 100 100" aria-label="Plan7">
        <circle cx="50" cy="50" r="48" fill="none" stroke="#4DA3FF" stroke-width="2.5"/>
        <circle cx="50" cy="50" r="42" fill="#FFFFFF"/>
        <polygon points="58,16 32,56 48,56 42,86 70,43 54,43" fill="#0A1626"/>
      </svg>
      <div>
        <div class="bn">PLAN<i>7</i></div>
        <div class="bs">SERVIÇOS E ENGENHARIA</div>
        <div class="bl">PROJETOS · INSTALAÇÕES ELÉTRICAS · CLIMATIZAÇÃO</div>
      </div>
    </div>
    <div class="hoje" id="hoje"></div>
  </div>
</header>

<div class="wrap">
  <div class="seg" id="nav">
    <button class="on" data-p="ev">Eventos</button>
    <button data-p="fin">Financeiro</button>
  </div>

  <div id="pEv">
  <div class="stats">
    <div class="stat"><b id="sPend">0</b><span>Eventos pendentes</span></div>
    <div class="stat"><b id="sRec">R$ 0</b><span>A receber</span></div>
    <div class="stat"><b id="sOk">R$ 0</b><span>Já recebido</span></div>
  </div>

  <div class="tabs" id="tabs">
    <button class="tab on" data-f="all">Todos</button>
    <button class="tab" data-f="pend">Pendentes</button>
    <button class="tab" data-f="done">Concluídos</button>
  </div>

  <div id="list"></div>
  </div>

  <div id="pFin" style="display:none">
    <div class="mnav">
      <button id="mPrev" aria-label="Mês anterior">&#8249;</button>
      <b id="mLabel"></b>
      <button id="mNext" aria-label="Próximo mês">&#8250;</button>
    </div>
    <div class="stats2" id="fStats"></div>
    <div id="fList"></div>
  </div>
</div>

<button class="fab" id="add">+ Novo evento</button>

<div class="ov" id="ovF">
  <form class="modal" id="formF">
    <h2 id="fmt">Novo lançamento</h2>
    <label>Tipo</label>
    <select id="gKind"><option value="saida">Despesa</option><option value="entrada">Entrada</option></select>
    <label>Descrição</label>
    <input id="gName" required placeholder="Ex.: Aluguel">
    <div class="row">
      <div><label>Dia do mês (opcional)</label><input type="number" id="gDay" min="1" max="31" placeholder="Ex.: 10"></div>
      <div><label>Fonte (opcional)</label><input id="gSrc" placeholder="Ex.: Plan7"></div>
    </div>
    <div class="row">
      <div><label>Valor previsto R$</label><input type="number" id="gVal" min="0" step="0.01" required></div>
      <div><label>Valor real R$ (opcional)</label><input type="number" id="gAct" min="0" step="0.01" placeholder="se diferente"></div>
    </div>
    <label style="display:flex;gap:8px;align-items:center;text-transform:none;letter-spacing:0;font-size:.85rem;color:var(--ink);font-weight:400" id="gRepL"><input type="checkbox" id="gRep" style="width:auto;accent-color:#1D6FD8"><span id="gRepT">Repetir todo mês</span></label>
    <div class="btns">
      <button type="button" class="btn" id="gCancel">Cancelar</button>
      <button class="btn p">Salvar</button>
    </div>
    <div class="btns" id="gDel" style="display:none"></div>
  </form>
</div>

<div class="ov" id="ov">
  <form class="modal" id="form">
    <h2 id="mt">Novo evento</h2>
    <label>Título</label>
    <input id="fTitle" required placeholder="Ex.: Instalação de ar-condicionado">
    <div class="row">
      <div><label>Data</label><input type="date" id="fDate" required></div>
      <div><label>Horário (opcional)</label><input type="time" id="fTime"></div>
    </div>
    <div class="row">
      <div><label>Tipo</label>
        <select id="fType">
          <option value="servico">Serviço</option>
          <option value="receber">Recebimento</option>
          <option value="divulgacao">Divulgação</option>
          <option value="outro">Outro</option>
        </select></div>
      <div><label>Valor R$ (opcional)</label><input type="number" id="fVal" min="0" step="0.01" placeholder="0,00"></div>
    </div>
    <label style="display:flex;gap:8px;align-items:center;text-transform:none;letter-spacing:0;font-size:.85rem;color:var(--ink);font-weight:400"><input type="checkbox" id="fAuto" checked style="width:auto;accent-color:#1D6FD8">Serviço com valor: criar também o recebimento na mesma data</label>
    <label>Cliente / empresa (opcional)</label>
    <input id="fWho">
    <label>Atenção / impedimento (opcional)</label>
    <input id="fAlert" placeholder="Ex.: parede sem furo, falta material">
    <label>Observações (opcional)</label>
    <textarea id="fNotes" rows="2"></textarea>
    <div class="btns">
      <button type="button" class="btn" id="cancel">Cancelar</button>
      <button class="btn p">Salvar</button>
    </div>
  </form>
</div>

<script>
const KEY="organizador-tarefas-v1";
const initial=[
 {id:1,title:"Criar arte de divulgação (limpeza/instalação de ar-condicionado e instalações elétricas residenciais)",date:"2026-11-19",time:"",type:"divulgacao",value:"",who:"",notes:"Divulgar no grupo da igreja e para amigos mais próximos.",done:false},
 {id:2,title:"Limpeza e instalação de ar-condicionado",date:"2026-11-20",time:"07:00",type:"servico",value:500,who:"Irmã Neide",notes:"",done:false,pair:6,started:true,alert:"Parede ainda sem furo para a tubulação. Verificar com a irmã Neide: eu faço o furo ou ela indica um pedreiro?"},
 {id:3,title:"2 instalações + 2 ventiladores de teto",date:"2026-11-20",time:"13:30",type:"servico",value:400,who:"Diego Campos",notes:"",done:false,pair:7,started:true,alert:"Comprar parafusos e furar as hastes dos ventiladores para evitar movimentação."},
 {id:6,title:"Receber: limpeza e instalação de ar-condicionado",date:"2026-11-20",time:"",type:"receber",value:500,who:"Irmã Neide",notes:"",done:true,pair:2},
 {id:7,title:"Receber: 2 instalações + 2 ventiladores de teto",date:"2026-11-20",time:"",type:"receber",value:400,who:"Diego Campos",notes:"",done:false,pair:3},
 {id:8,title:"Limpeza de 2 ar-condicionados",date:"2026-11-29",time:"",type:"servico",value:400,who:"Felipe",notes:"",done:false,pair:9,alert:"Pendente de confirmação de data com o Felipe."},
 {id:9,title:"Receber: limpeza de 2 ar-condicionados",date:"2026-11-29",time:"",type:"receber",value:400,who:"Felipe",notes:"",done:false,pair:8},
 {id:10,title:"Limpeza de 2 ar-condicionados (R$ 200 cada)",date:"2026-11-26",time:"",type:"servico",value:400,who:"Mãe da Aline",notes:"",done:false,pair:11,alert:"Confirmar a nova data com a mãe da Aline."},
 {id:11,title:"Receber: limpeza de 2 ar-condicionados",date:"2026-11-26",time:"",type:"receber",value:400,who:"Mãe da Aline",notes:"2 x R$ 200",done:false,pair:10},
 {id:12,title:"Limpeza de 3 ar-condicionados em Sinop (R$ 200 cada)",date:"2026-11-23",time:"",type:"servico",value:600,who:"Pablo",notes:"Sinop-MT",done:false,pair:13},
 {id:13,title:"Receber: limpeza de 3 ar-condicionados em Sinop",date:"2026-11-23",time:"",type:"receber",value:600,who:"Pablo",notes:"3 x R$ 200",done:false,pair:12},
 {id:14,title:"Visita técnica: verificar local de instalação de 1 ar-condicionado",date:"2026-11-25",time:"",type:"servico",value:"",who:"Jason Godoy",notes:"Manhã. Só a visita, o serviço de instalação será depois.",done:false,alert:"Comprar suporte externo. Verificar se o ar-condicionado novo já vem com tubulação ou se já há tubulação no local da instalação."},
 {id:15,title:"Limpeza de 2 ar-condicionados",date:"2026-11-24",time:"",type:"servico",value:400,who:"Matheus",notes:"",done:false},
 {id:16,title:"Limpeza de 1 ar-condicionado em Sinop",date:"2026-11-24",time:"",type:"servico",value:200,who:"Matheus",notes:"Sinop-MT",done:true},
 {id:4,title:"Receber contrato (planejamento)",date:"2026-12-05",time:"",type:"receber",value:800,who:"LG Instalações",notes:"",done:false},
 {id:5,title:"Receber pagamento",date:"2026-12-05",time:"",type:"receber",value:750,who:"Burim Refrigeração",notes:"",done:false}
];
let tasks,filter="all",editing=null,mem=null;
function load(){try{const r=localStorage.getItem(KEY);if(r)return JSON.parse(r)}catch(e){}return mem||initial.map(x=>({...x}))}
function save(){mem=tasks;try{localStorage.setItem(KEY,JSON.stringify(tasks))}catch(e){}}
tasks=load();
/* migração: recebimentos de sexta (20/11) para quem já tinha dados salvos */
try{
  if(!localStorage.getItem("organizador-mig2")){
    for(const n of initial.filter(x=>x.id===6||x.id===7)) if(!tasks.some(t=>t.id===n.id)) tasks.push({...n});
    const d=tasks.find(t=>t.id===3); if(d&&(d.value===""||d.value==null)) d.value=400;
    save(); localStorage.setItem("organizador-mig2","1");
  }
}catch(e){}

try{
  if(!localStorage.getItem("organizador-mig3")){
    for(const n of initial.filter(x=>x.id===8||x.id===9)) if(!tasks.some(t=>t.id===n.id)) tasks.push({...n});
    save(); localStorage.setItem("organizador-mig3","1");
  }
}catch(e){}

try{
  if(!localStorage.getItem("organizador-mig4")){
    for(const t of tasks){
      if((t.id===8||t.id===9)&&t.date==="2026-11-18"){t.date="2026-11-29";if(t.notes==="Data a confirmar.")t.notes=""}
      if((t.id===2||t.id===6)&&t.who==="Irmã da igreja")t.who="Irmã Neide";
      if((t.id===2||t.id===3)&&!t.notes)t.notes="Serviço iniciado.";
    }
    save(); localStorage.setItem("organizador-mig4","1");
  }
}catch(e){}

try{
  if(!localStorage.getItem("organizador-mig5")){
    for(const n of initial.filter(x=>x.id===10||x.id===11)) if(!tasks.some(t=>t.id===n.id)) tasks.push({...n});
    save(); localStorage.setItem("organizador-mig5","1");
  }
}catch(e){}

try{
  if(!localStorage.getItem("organizador-mig6")){
    const P={2:6,6:2,3:7,7:3,8:9,9:8,10:11,11:10};
    for(const t of tasks){ if(P[t.id]&&!t.pair)t.pair=P[t.id];
      if((t.id===2||t.id===3)&&t.started===undefined){t.started=true; if(t.notes==="Serviço iniciado.")t.notes=""} }
    const r=tasks.find(t=>t.id===6); if(r) r.done=true;   // irmã Neide: já pago
    save(); localStorage.setItem("organizador-mig6","1");
  }
}catch(e){}

try{
  if(!localStorage.getItem("organizador-mig7")){
    for(const n of initial.filter(x=>x.id===12||x.id===13)) if(!tasks.some(t=>t.id===n.id)) tasks.push({...n});
    save(); localStorage.setItem("organizador-mig7","1");
  }
}catch(e){}

try{
  if(!localStorage.getItem("organizador-mig8")){
    const t=tasks.find(x=>x.id===2); if(t&&!t.alert) t.alert="Parede ainda sem furo para a tubulação. Verificar com a irmã Neide: eu faço o furo ou ela indica um pedreiro?";
    save(); localStorage.setItem("organizador-mig8","1");
  }
}catch(e){}

try{
  if(!localStorage.getItem("organizador-mig9")){
    const t=tasks.find(x=>x.id===3); if(t&&!t.alert) t.alert="Comprar parafusos e furar as hastes dos ventiladores para evitar movimentação.";
    save(); localStorage.setItem("organizador-mig9","1");
  }
}catch(e){}

try{
  if(!localStorage.getItem("organizador-mig10")){
    for(const n of initial.filter(x=>x.id===14)) if(!tasks.some(t=>t.id===n.id)) tasks.push({...n});
    save(); localStorage.setItem("organizador-mig10","1");
  }
}catch(e){}

try{
  if(!localStorage.getItem("organizador-mig11")){
    const t=tasks.find(x=>x.id===10); if(t&&!t.alert) t.alert="Confirmar a nova data com a mãe da Aline.";
    save(); localStorage.setItem("organizador-mig11","1");
  }
}catch(e){}

try{
  if(!localStorage.getItem("organizador-mig12")){
    const t=tasks.find(x=>x.id===8); if(t&&!t.alert) t.alert="Pendente de confirmação de data com o Felipe.";
    save(); localStorage.setItem("organizador-mig12","1");
  }
}catch(e){}

try{
  if(!localStorage.getItem("organizador-mig13")){
    for(const n of initial.filter(x=>x.id===15)) if(!tasks.some(t=>t.id===n.id)) tasks.push({...n});
    save(); localStorage.setItem("organizador-mig13","1");
  }
}catch(e){}

try{
  if(!localStorage.getItem("organizador-mig14")){
    for(const n of initial.filter(x=>x.id===16)) if(!tasks.some(t=>t.id===n.id)) tasks.push({...n});
    save(); localStorage.setItem("organizador-mig14","1");
  }
}catch(e){}

/* Todo serviço com valor tem um recebimento ligado; isso garante o total no painel */
function reconcile(){
  let ch=false;
  for(const t of tasks.slice()){
    if(t.type==="receber") continue;
    const v=Number(t.value)||0;
    const p=t.pair?tasks.find(x=>x.id===t.pair):null;
    if(v>0&&!p){
      const nid=t.id+1000000;
      if(!tasks.some(x=>x.id===nid)){
        tasks.push({id:nid,done:false,title:"Receber: "+t.title,date:t.date,time:"",type:"receber",value:t.value,who:t.who,notes:"",pair:t.id});
      }
      t.pair=nid;ch=true;
    }else if(p&&p.type==="receber"&&!p.done){
      /* o recebimento ligado acompanha o serviço (data, valor e cliente) até ser recebido */
      if(p.date!==t.date){p.date=t.date;ch=true}
      if(v>0&&Number(p.value)!==v){p.value=t.value;ch=true}
      if(p.who!==t.who){p.who=t.who;ch=true}
    }
  }
  if(ch)save();
}
reconcile();

const $=s=>document.querySelector(s);
const money=v=>"R$ "+Number(v).toLocaleString("pt-BR",{minimumFractionDigits:v%1?2:0,maximumFractionDigits:2});
const todayISO=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
function label(iso){
  const t=new Date(todayISO()+"T00:00"),d=new Date(iso+"T00:00"),diff=Math.round((d-t)/864e5);
  const txt=d.toLocaleDateString("pt-BR",{weekday:"long",day:"2-digit",month:"long"});
  return {txt,diff,tag:diff<0?"Atrasada":diff===0?"Hoje":diff===1?"Amanhã":""};
}
const names={servico:"Serviço",receber:"Recebimento",divulgacao:"Divulgação",outro:"Outro"};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const pairOf=t=>t.pair?tasks.find(x=>x.id===t.pair):null;
/* recebimento ligado a um serviço: aparece dentro do card do serviço, não separado */
const isShadow=t=>t.type==="receber"&&!!t.pair&&tasks.some(x=>x.id===t.pair&&x.type!=="receber");
const isPaid=t=>{const p=pairOf(t);return p?p.done:!!t.paid};
function render(){
  $("#hoje").textContent="Hoje é "+new Date().toLocaleDateString("pt-BR",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
  $("#sPend").textContent=tasks.filter(t=>!t.done&&!isShadow(t)).length;
  const sum=f=>tasks.filter(t=>t.type==="receber"&&f(t)).reduce((a,t)=>a+(Number(t.value)||0),0);
  $("#sRec").textContent=money(sum(t=>!t.done));
  $("#sOk").textContent=money(sum(t=>t.done));
  document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("on",b.dataset.f===filter));

  const vis=tasks.filter(t=>!isShadow(t))
    .filter(t=>filter==="all"||(filter==="pend"?!t.done:t.done))
    .sort((a,b)=>(a.date+(a.time||"99:99")).localeCompare(b.date+(b.time||"99:99")));
  if(!vis.length){$("#list").innerHTML='<div class="empty">Nada por aqui.</div>';return}
  let html="",last="";
  for(const t of vis){
    if(t.date!==last){last=t.date;const l=label(t.date);
      html+=`<div class="day">${l.txt}${l.tag?`<em class="${l.diff<0?"atr":""}">${l.tag}</em>`:""}</div>`}
    html+=`<div class="task ${t.type} ${t.done?"done":""} ${!t.done&&t.date<todayISO()?"late":""}">
      <input type="checkbox" class="chk" ${t.done?"checked":""} data-id="${t.id}" data-a="tog">
      <div class="body">
        <div class="tp">${names[t.type]||""}</div>
        <div class="t">${esc(t.title)}</div>
        <div class="meta">
          ${t.time?`<span>${esc(t.time)}</span>`:""}
          ${t.who?`<span>${esc(t.who)}</span>`:""}
          ${t.value!==""&&t.value!=null?`<span class="val">${money(t.value)}</span>`:""}
        </div>
        ${t.notes?`<div class="meta">${esc(t.notes)}</div>`:""}
        ${t.alert?`<div class="warn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#B26A00" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="M12 3 2 20h20L12 3z" fill="#FFE08A"/><path d="M12 10v4"/><circle cx="12" cy="17" r=".6" fill="#B26A00"/></svg><span><b>Atenção:</b> ${esc(t.alert)}</span></div>`:""}
        ${t.type!=="receber"&&t.value!==""&&t.value!=null?`<div class="chips">
          ${t.done?"":`<button class="chip ${t.started?"on":""}" data-id="${t.id}" data-a="start">${t.started?"Em andamento":"Iniciar"}</button>`}
          <button class="chip pay ${isPaid(t)?"on":""}" data-id="${t.id}" data-a="pay">${isPaid(t)?"Pago":"Não pago"}</button></div>`:""}
      </div>
      <div class="act">
        <button class="ib" data-id="${t.id}" data-a="edit">Editar</button>
        <button class="ib" data-id="${t.id}" data-a="del">Excluir</button>
      </div></div>`;
  }
  $("#list").innerHTML=html;
}

$("#list").addEventListener("click",e=>{
  const el=e.target.closest("[data-a]");if(!el)return;
  const id=+el.dataset.id,t=tasks.find(x=>x.id===id),a=el.dataset.a;
  if(a==="tog"){t.done=el.checked;save();render()}
  if(a==="del"){if(el.dataset.sure){tasks=tasks.filter(x=>x.id!==id);save();render()}
    else{el.dataset.sure=1;el.textContent="Confirmar?";setTimeout(()=>{el.dataset.sure="";el.textContent="Excluir"},2500)}}
  if(a==="edit")openForm(t);
  if(a==="start"){t.started=!t.started;save();render()}
  if(a==="pay"){const p=pairOf(t);if(p)p.done=!isPaid(t);else t.paid=!isPaid(t);save();render()}
});
$("#tabs").addEventListener("click",e=>{if(e.target.dataset.f){filter=e.target.dataset.f;render()}});

function openForm(t){
  editing=t||null;$("#mt").textContent=t?"Editar evento":"Novo evento";
  $("#fTitle").value=t?t.title:"";$("#fDate").value=t?t.date:todayISO();$("#fTime").value=t?t.time:"";
  $("#fType").value=t?t.type:"servico";$("#fVal").value=t?t.value:"";$("#fWho").value=t?t.who:"";$("#fNotes").value=t?t.notes:"";$("#fAlert").value=t?(t.alert||""):"";
  $("#fAuto").checked=!t;$("#fAuto").parentElement.style.display=t?"none":"flex";
  $("#ov").classList.add("on");setTimeout(()=>$("#fTitle").focus(),50);
}
const close=()=>$("#ov").classList.remove("on");
$("#add").onclick=()=>{page==="fin"?openFin():openForm()};
$("#cancel").onclick=close;
$("#ov").addEventListener("click",e=>{if(e.target.id==="ov")close()});
$("#form").addEventListener("submit",e=>{
  e.preventDefault();
  const d={title:$("#fTitle").value.trim(),date:$("#fDate").value,time:$("#fTime").value,type:$("#fType").value,
    value:$("#fVal").value===""?"":Number($("#fVal").value),who:$("#fWho").value.trim(),notes:$("#fNotes").value.trim(),alert:$("#fAlert").value.trim()};
  if(editing){
    const old={date:editing.date,who:editing.who};
    Object.assign(editing,d);
    const p=editing.pair?tasks.find(x=>x.id===editing.pair):null;
    if(p){
      if(editing.type==="receber"||(Number(d.value)||0)>0){
        p.value=d.value;
        if(p.date===old.date)p.date=d.date;
        if(p.who===old.who)p.who=d.who;
      }else if(!p.done){ tasks=tasks.filter(x=>x!==p); delete editing.pair; }
    }
    reconcile();
  }
  else{
    const id=Date.now();
    const auto=d.type!=="receber"&&d.value!==""&&d.value>0&&$("#fAuto").checked;
    tasks.push({id,done:false,...d,...(auto?{pair:id+1}:{})});
    if(auto)
      tasks.push({id:id+1,done:false,title:"Receber: "+d.title,date:d.date,time:"",type:"receber",value:d.value,who:d.who,notes:"",pair:id});
  }
  save();close();render();
});
/* =================== FINANCEIRO =================== */
const FKEY="plan7-fin-v1", FIN_START="2026-12", FIN_MIN="2026-11";
const finSeed={
  skips:{},
  recurring:[
    {id:"r1",kind:"saida",name:"Alimentação",day:null,value:1000,from:"2026-12",to:null},
    {id:"r2",kind:"saida",name:"Aluguel",day:10,value:1600,from:"2026-12",to:null},
    {id:"r3",kind:"saida",name:"Ag. Luz Int.",day:null,value:450,from:"2026-12",to:null},
    {id:"r4",kind:"saida",name:"FIES",day:20,value:590,from:"2026-12",to:null},
    {id:"r5",kind:"saida",name:"Plano de Saúde",day:25,value:445,from:"2026-12",to:null},
    {id:"r6",kind:"saida",name:"Terreno",day:15,value:850,from:"2026-12",to:null}
  ],
  items:[
    {id:"e1",kind:"entrada",month:"2026-12",name:"Poupando",source:"",day:null,value:4500},
    {id:"e2",kind:"entrada",month:"2027-01",name:"Aditivo CT Precisamec",source:"Plan7",day:null,value:2130},
    {id:"e3",kind:"entrada",month:"2026-12",name:"Precisamec CT torque",source:"Plan7",day:null,value:1400},
    {id:"e4",kind:"entrada",month:"2027-01",name:"Precisamec CT torque",source:"Plan7",day:null,value:1400},
    {id:"e5",kind:"entrada",month:"2026-12",name:"Precisamec Ar Comp.",source:"Plan7",day:null,value:1400},
    {id:"e6",kind:"entrada",month:"2027-01",name:"Precisamec Ar Comp.",source:"Plan7",day:null,value:1400},
    {id:"e7",kind:"entrada",month:"2027-02",name:"Invest. Renda Fixa 1% ao mês",source:"",day:null,value:39.15}
  ]
};
let fin;
function finLoad(){try{const r=localStorage.getItem(FKEY);if(r)return JSON.parse(r)}catch(e){}return JSON.parse(JSON.stringify(finSeed))}
let finMem=null;
function finSave(){finMem=fin;try{localStorage.setItem(FKEY,JSON.stringify(fin))}catch(e){}}
fin=finMem||finLoad();
const mAdd=(m,n)=>{let[y,mo]=m.split("-").map(Number);mo+=n;y+=Math.floor((mo-1)/12);mo=((mo-1)%12+12)%12+1;return y+"-"+String(mo).padStart(2,"0")};
const mName=m=>{const[y,mo]=m.split("-").map(Number);return new Date(y,mo-1,1).toLocaleDateString("pt-BR",{month:"long",year:"numeric"})};
const curMonth=()=>todayISO().slice(0,7);
let finMonth=curMonth()<FIN_MIN?FIN_MIN:curMonth();

function ensureMonth(m){
  let ch=false;
  for(const r of fin.recurring){
    if(r.from<=m&&(!r.to||m<=r.to)&&!fin.skips[r.id+"|"+m]&&!fin.items.some(i=>i.recId===r.id&&i.month===m)){
      fin.items.push({id:r.id+"_"+m,recId:r.id,kind:r.kind,month:m,name:r.name,source:r.source||"",day:r.day,value:r.value,done:false});ch=true;
    }
  }
  if(ch)finSave();
}
/* recebimentos do organizador de eventos entram nas entradas do mês */
function evEntries(m){
  return tasks.filter(t=>t.type==="receber"&&t.date.slice(0,7)===m).map(t=>({
    virtual:true,id:"ev"+t.id,evId:t.id,kind:"entrada",name:t.who||t.title,source:"Plan7",
    day:+t.date.slice(8,10),value:Number(t.value)||0,done:!!t.done}));
}
const planned=i=>Number(i.value)||0;
const real=i=>i.done?((i.actual!==undefined&&i.actual!==null&&i.actual!=="")?Number(i.actual):planned(i)):0;
function monthData(m){
  ensureMonth(m);
  const ent=fin.items.filter(i=>i.month===m&&i.kind==="entrada").concat(evEntries(m));
  const sai=fin.items.filter(i=>i.month===m&&i.kind==="saida");
  const sum=(a,f)=>a.reduce((x,i)=>x+f(i),0);
  return {ent,sai,entP:sum(ent,planned),entR:sum(ent,real),saiP:sum(sai,planned),saiR:sum(sai,real)};
}
function accumulated(m){
  if(m<FIN_START){const d=monthData(m);return d.entP-d.saiP}
  let acc=0;
  for(let x=FIN_START;x<=m;x=mAdd(x,1)){const d=monthData(x);acc+=d.entP-d.saiP}
  return acc;
}
function isLateF(i,m){
  if(i.done||!i.day)return false;
  const due=new Date(+m.slice(0,4),+m.slice(5,7)-1,i.day);
  return due<new Date(todayISO()+"T00:00");
}
const byDay=(a,b)=>(a.day||99)-(b.day||99)||a.name.localeCompare(b.name);
const fm=v=>money(Math.round(v*100)/100);

function renderFin(){
  const m=finMonth,d=monthData(m),sm=d.entP-d.saiP,ac=accumulated(m);
  $("#mLabel").textContent=mName(m);
  $("#mPrev").disabled=m<=FIN_MIN;
  $("#fStats").innerHTML=
    `<div class="stat"><b>${fm(d.entP)}</b><span>Entradas</span><small>recebido ${fm(d.entR)}</small></div>
     <div class="stat"><b>${fm(d.saiP)}</b><span>Saídas</span><small>pago ${fm(d.saiR)}</small></div>
     <div class="stat ${sm<0?"neg":""}"><b>${fm(sm)}</b><span>Saldo do mês</span><small>realizado ${fm(d.entR-d.saiR)}</small></div>
     <div class="stat ${ac<0?"neg":""}"><b>${fm(ac)}</b><span>Saldo acumulado</span><small>${m<FIN_START?"o acumulado começa em "+mName(FIN_START):"desde "+mName(FIN_START)}</small></div>`;
  const row=(i,isEnt)=>{
    const late=isLateF(i,m);
    const sub=[i.day?("Dia "+i.day):"",i.source||"",i.recId?"recorrente":"",i.virtual?"do painel de eventos":""].filter(Boolean).join(" · ");
    const diff=i.done&&i.actual!==undefined&&i.actual!==null&&i.actual!==""&&Number(i.actual)!==planned(i);
    return `<div class="frow ${i.done?"done":""} ${late?"late":""}">
      <input type="checkbox" class="chk" ${i.done?"checked":""} data-fid="${i.id}" data-fa="tog" title="${isEnt?"Recebido":"Pago"}">
      <div class="fb"><div class="ft">${esc(i.name)}</div><div class="fm">${esc(sub)}${late?" · atrasado":""}</div></div>
      <div class="fv">${fm(planned(i))}${diff?`<small>${isEnt?"recebido":"pago"} ${fm(Number(i.actual))}</small>`:""}</div>
      ${i.virtual?"":`<button class="ib" data-fid="${i.id}" data-fa="edit">Editar</button>`}</div>`;
  };
  $("#fList").innerHTML=
    `<div class="fsec"><h3>Entradas <span>${fm(d.entP)}</span></h3>${d.ent.sort(byDay).map(i=>row(i,true)).join("")||'<div class="fm" style="padding:10px 0">Nenhuma entrada neste mês.</div>'}
      <p class="fnote">Recebimentos de serviços e clientes do painel de eventos entram aqui sozinhos, na data do evento.</p></div>
     <div class="fsec"><h3>Despesas <span>${fm(d.saiP)}</span></h3>${d.sai.sort(byDay).map(i=>row(i,false)).join("")||'<div class="fm" style="padding:10px 0">Nenhuma despesa neste mês.</div>'}</div>`;
}

$("#mPrev").onclick=()=>{if(finMonth>FIN_MIN){finMonth=mAdd(finMonth,-1);renderFin()}};
$("#mNext").onclick=()=>{finMonth=mAdd(finMonth,1);renderFin()};
$("#fList").addEventListener("click",e=>{
  const el=e.target.closest("[data-fa]");if(!el)return;
  const id=el.dataset.fid,a=el.dataset.fa;
  if(id.startsWith("ev")){const t=tasks.find(x=>x.id===+id.slice(2));if(a==="tog"&&t){t.done=el.checked;save();render();renderFin()}return}
  const it=fin.items.find(x=>x.id===id);if(!it)return;
  if(a==="tog"){it.done=el.checked;finSave();renderFin()}
  if(a==="edit")openFin(it);
});

let editF=null;
function openFin(it){
  editF=it||null;
  $("#fmt").textContent=it?"Editar lançamento":"Novo lançamento";
  $("#gKind").value=it?it.kind:"saida";$("#gName").value=it?it.name:"";
  $("#gDay").value=it&&it.day?it.day:"";$("#gSrc").value=it?(it.source||""):"";
  $("#gVal").value=it?it.value:"";$("#gAct").value=it&&it.actual!=null?it.actual:"";
  $("#gRep").checked=it?!!it.recId:false;
  $("#gRepT").textContent=it&&it.recId?"Aplicar também aos meses seguintes":"Repetir todo mês";
  const dd=$("#gDel");dd.innerHTML="";dd.style.display="none";
  if(it){
    dd.style.display="flex";
    dd.innerHTML=`<button type="button" class="dbtn" id="gDelOne">Excluir só deste mês</button>`+(it.recId?`<button type="button" class="dbtn" id="gDelAll">Parar daqui para frente</button>`:"");
    $("#gDelOne").onclick=()=>{
      if(it.recId)fin.skips[it.recId+"|"+it.month]=true;
      fin.items=fin.items.filter(x=>x!==it);finSave();closeF();renderFin();
    };
    if(it.recId)$("#gDelAll").onclick=()=>{
      const r=fin.recurring.find(x=>x.id===it.recId);
      if(r)r.to=mAdd(it.month,-1);
      fin.items=fin.items.filter(x=>!(x.recId===it.recId&&x.month>=it.month&&(x===it||!x.done)));
      finSave();closeF();renderFin();
    };
  }
  $("#ovF").classList.add("on");setTimeout(()=>$("#gName").focus(),50);
}
const closeF=()=>$("#ovF").classList.remove("on");
$("#gCancel").onclick=closeF;
$("#ovF").addEventListener("click",e=>{if(e.target.id==="ovF")closeF()});
$("#formF").addEventListener("submit",e=>{
  e.preventDefault();
  const f={kind:$("#gKind").value,name:$("#gName").value.trim(),day:$("#gDay").value?+$("#gDay").value:null,
    source:$("#gSrc").value.trim(),value:Number($("#gVal").value)||0,actual:$("#gAct").value===""?null:Number($("#gAct").value)};
  const rep=$("#gRep").checked;
  if(editF){
    Object.assign(editF,f);
    if(editF.recId&&rep){
      const r=fin.recurring.find(x=>x.id===editF.recId);
      if(r)Object.assign(r,{kind:f.kind,name:f.name,day:f.day,source:f.source,value:f.value});
      for(const x of fin.items)if(x.recId===editF.recId&&x.month>editF.month&&!x.done)
        Object.assign(x,{kind:f.kind,name:f.name,day:f.day,source:f.source,value:f.value});
    }else if(!editF.recId&&rep){
      const rid="u"+Date.now();
      fin.recurring.push({id:rid,kind:f.kind,name:f.name,day:f.day,source:f.source,value:f.value,from:mAdd(finMonth,1),to:null});
    }
  }else{
    const id="m"+Date.now();
    const it={id,kind:f.kind,month:finMonth,name:f.name,source:f.source,day:f.day,value:f.value,actual:f.actual,done:false};
    if(rep){
      const rid="u"+Date.now();
      fin.recurring.push({id:rid,kind:f.kind,name:f.name,day:f.day,source:f.source,value:f.value,from:finMonth,to:null});
      it.recId=rid;it.id=rid+"_"+finMonth;
    }
    fin.items.push(it);
  }
  finSave();closeF();renderFin();
});

/* navegação Eventos / Financeiro */
let page="ev";
function setPage(p){
  page=p;
  $("#pEv").style.display=p==="ev"?"":"none";
  $("#pFin").style.display=p==="fin"?"":"none";
  document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on",b.dataset.p===p));
  $("#add").textContent=p==="ev"?"+ Novo evento":"+ Novo lançamento";
  if(p==="fin")renderFin();else render();
}
$("#nav").addEventListener("click",e=>{if(e.target.dataset.p)setPage(e.target.dataset.p)});

render();
</script>
